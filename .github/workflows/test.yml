name: Tests

on:
  push:
  pull_request:

jobs:
  wallet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build && git diff --exit-code -- dist/app.js
      - run: npm test
